<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halo - local voice chat</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5f0e8'/%3E%3Cg stroke='%23a84d2a' stroke-width='2.8' stroke-linecap='round'%3E%3Cpath d='M8 13v6'/%3E%3Cpath d='M13 8.5v15'/%3E%3Cpath d='M18 11v10'/%3E%3Cpath d='M23 14v4'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Halo</h1>
    </div>
    <button class="iconbtn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M4 8h4.4M13.6 8H20" />
        <path d="M4 16h8.6M17.4 16H20" />
        <circle cx="11" cy="8" r="2.4" />
        <circle cx="15" cy="16" r="2.4" />
      </svg>
    </button>
  </header>

  <main>
    <section class="stage">
      <div class="orb-wrap">
        <canvas id="orb" width="640" height="640" aria-hidden="true"></canvas>
      </div>

      <div class="status-row">
        <p class="status" id="status">Starting</p>
        <p class="substatus" id="substatus"></p>
      </div>

      <div class="controls">
        <button id="start-btn" class="primary" disabled>Start talking</button>

        <button id="mic-btn" class="iconbtn" title="Toggle microphone (M)" aria-label="Toggle microphone" disabled>
          <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
            <path d="M12 18v3" />
          </svg>
          <svg class="i-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4l16 16" />
            <path d="M9 9v3a3 3 0 0 0 5.1 2.1" />
            <path d="M15 10V5a3 3 0 0 0-5.9-.7" />
            <path d="M5 11.5a6.5 6.5 0 0 0 10 5.4" />
            <path d="M19 11.5a6.5 6.5 0 0 1-.7 3" />
            <path d="M12 18.5V21" />
          </svg>
        </button>

        <button id="stop-btn" class="iconbtn" title="Interrupt the assistant" aria-label="Interrupt the assistant" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" />
          </svg>
        </button>

        <button id="reset-btn" class="iconbtn" title="Clear the conversation" aria-label="Clear the conversation" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
        </button>
      </div>
    </section>

    <section class="panel">
      <div class="transcript" id="transcript">
        <div class="empty" id="transcript-empty">
          <b>Press Start talking, then just speak.</b>
          <span class="hint">Wear headphones. Without them the assistant hears itself and starts answering its own questions.</span>
        </div>
      </div>

      <form class="composer" id="composer">
        <input id="text-input" autocomplete="off" placeholder="Type instead of speaking" disabled />
        <button type="submit" class="primary" disabled id="send-btn">Send</button>
      </form>
    </section>
  </main>
</div>

<dialog id="settings">
  <form method="dialog" class="sheet">
    <h2>Settings</h2>

    <label>Ollama model
      <select id="set-model"></select>
    </label>

    <label>Voice
      <select id="set-voice"></select>
    </label>

    <label>Speaking speed <output id="set-speed-val">1.00</output>
      <input type="range" id="set-speed" min="0.6" max="1.6" step="0.05" value="1" />
    </label>

    <label>Turn-taking mode
      <select id="set-mode">
        <option value="handsfree">Hands-free (always listening)</option>
        <option value="ptt">Push to talk (hold Space)</option>
      </select>
    </label>

    <label class="check">
      <input type="checkbox" id="set-echo" />
      <span>Speaker mode: mute my mic while the assistant is talking</span>
    </label>

    <label>System prompt
      <textarea id="set-prompt" rows="4"></textarea>
    </label>

    <div class="sheet-actions">
      <button value="cancel">Close</button>
      <button value="apply" class="primary" id="apply-btn">Apply</button>
    </div>

    <div class="diag">
      <span class="engrave">Status</span>
      <div class="badges" id="badges" aria-live="polite"></div>
      <p class="fine" id="stack-info"></p>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
